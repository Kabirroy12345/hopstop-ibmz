name: HopStop CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run 22-test automated unit & causality test suite (Pytest)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

      - name: Run end-to-end training, validation calibration & audit benchmark
        env:
          PYTHONPATH: .
        run: |
          python -m hopstop.train_and_benchmark

