name: HopStop CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit & causality test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run end-to-end training & audit verification benchmark
        run: python -m hopstop.train_and_benchmark
